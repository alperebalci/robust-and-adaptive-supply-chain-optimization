name: Robust Satisficing

on:
  push:
    branches: [main]
    paths:
      - "projects/robust-satisficing-data-driven/**"
      - ".github/workflows/robust-satisficing.yml"
  pull_request:
    paths:
      - "projects/robust-satisficing-data-driven/**"
      - ".github/workflows/robust-satisficing.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: projects/robust-satisficing-data-driven

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Benchmark smoke
        run: python -m robust_satisficing.experiment
